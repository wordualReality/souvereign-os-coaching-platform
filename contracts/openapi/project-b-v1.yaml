      tags:
      - System
      operationId: getHealth
      summary: Health check
      description: 'Owner module: M-017. Actor: system. Produced event: none. All
        tenant-scoped operations must enforce Project B tenant boundary and Core access
        checks where applicable.'
      x-owner-module: M-017
      x-actor: system
      x-event-produced: none
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
