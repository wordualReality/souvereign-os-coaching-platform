openapi: 3.1.0
info:
  title: Project B Coach Studio / Tenant Journey Platform API
  version: 1.0.0
  summary: Final OpenAPI 3.1 contract seed for Project B dev handoff.
  description: Project B owns Coach Studio, tenant journey delivery, governed commerce,
    branded client delivery, projections, audit, and support surfaces. Project A/Core
    and DB/Canonical remain external truth providers. This contract is implementation-grade
    seed and must be reconciled with final DDL and event schema packs before freeze.
servers:
- url: https://api.sovereign-os.example.com
  description: Production placeholder
- url: https://staging-api.sovereign-os.example.com
  description: Staging placeholder
- url: http://localhost:3000
  description: Local development
tags:
- name: System
- name: Tenants
- name: Access
- name: Blueprints
- name: Branding
- name: Coach Studio
- name: Journey Publication
- name: Content
- name: Canonical Adapter
- name: Commercial
- name: Payments
- name: Enrollment
- name: Member Delivery
- name: Progress
- name: Messaging
- name: Notifications
- name: Community
- name: Analytics
- name: Audit
- name: Support
security:
- bearerAuth: []
