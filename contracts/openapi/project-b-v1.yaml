components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT/OIDC
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
  parameters:
    tenant_id:
      name: tenant_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Project B tenant boundary identifier.
    blueprint_id:
      name: blueprint_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    draft_id:
      name: draft_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    journey_version_id:
      name: journey_version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    asset_id:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    lead_id:
      name: lead_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    offer_id:
      name: offer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    provider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        enum:
        - stripe
        - mollie
        - adyen
        - manual
    client_id:
      name: client_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    enrollment_id:
      name: enrollment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    member_id:
      name: member_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    step_id:
      name: step_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    role_assignment_id:
      name: role_assignment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    case_id:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    X-Correlation-Id:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Correlation ID; generated by server if absent.
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 12
        maxLength: 128
      description: Idempotency key for commands; required by implementation for payment/activation/commands.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Access denied by tenant/Core policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found or hidden by tenant boundary
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: State/version conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unprocessable:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Money:
      type: object
      required:
      - currency
      - amount_minor
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount_minor:
          type: integer
          minimum: 0
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - correlation_id
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            correlation_id:
              type: string
              format: uuid
            retryable:
              type: boolean
              default: false
    PageInfo:
      type: object
      required:
      - limit
      - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    CommandAcceptedResponse:
      type: object
      required:
      - status
      - correlation_id
      properties:
        status:
          type: string
          enum:
          - accepted
        correlation_id:
          type: string
          format: uuid
    WebhookAcceptedResponse:
      type: object
      required:
      - status
      - event_id
