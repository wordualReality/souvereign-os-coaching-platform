name: kdb-m01-pg17-disposable

on:
  pull_request:
    paths:
      - "database/migrations/kdb/**"
      - "tests/kdb/**"
      - ".github/workflows/kdb-m01-pg17.yml"
  push:
    branches: ["kdb/**"]
    paths:
      - "database/migrations/kdb/**"
      - "tests/kdb/**"
      - ".github/workflows/kdb-m01-pg17.yml"

permissions:
  contents: read

jobs:
  pg17-apply-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kdb_local_super
          POSTGRES_DB: kdb_m01_disposable
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kdb_local_super -d kdb_m01_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply 001-003, oracles, rollback/reapply
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_disposable_apply.py
