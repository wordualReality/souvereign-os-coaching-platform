name: kdb-m01-pg17-disposable

on:
  pull_request:
    paths:
      - "database/migrations/kdb/**"
      - "tests/kdb/**"
      - "n8n/kdb-dev/**"
      - "contracts/kdb/**"
      - "services/kdb/**"
      - "scripts/validate_sql_static.py"
      - ".github/workflows/kdb-m01-pg17.yml"
  push:
    branches: ["kdb/**"]
    paths:
      - "database/migrations/kdb/**"
      - "tests/kdb/**"
      - "n8n/kdb-dev/**"
      - "contracts/kdb/**"
      - "services/kdb/**"
      - "scripts/validate_sql_static.py"
      - ".github/workflows/kdb-m01-pg17.yml"

permissions:
  contents: read

jobs:
  pg17-apply-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kdb_local_super
          POSTGRES_DB: kdb_m01_disposable
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kdb_local_super -d kdb_m01_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply 001-003 plus P3 005 and P4 digest integrity, oracles, rollback/reapply
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_disposable_apply.py
      - name: O1-O3 command path fail-closed until trust attested
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_disposable_command_path.py
      - name: Offline classifier and replay/DLQ policy
        run: |
          node n8n/kdb-dev/test_workflow_regression.cjs n8n/kdb-dev/tenant-guard-candidate /tmp/kdb-tenant-guard.json .
          node n8n/kdb-dev/test_replay_dlq.cjs n8n/kdb-dev/tenant-guard-candidate /tmp/kdb-replay-dlq.json
          python3 tests/kdb/test_replay_dlq_policy.py
          python3 tests/kdb/test_tenant_guard_source.py
          python3 tests/kdb/test_provenance_eligibility.py
          python3 tests/kdb/test_lifecycle_eligibility.py
          python3 tests/kdb/test_offline_diagnostic.py
          python3 tests/kdb/test_p11_source_review_readback.py
          python3 tests/kdb/test_p12_commit_reconnect.py
          python3 tests/kdb/test_review_handoff_preview.py
          python3 tests/kdb/test_offline_review_inbox.py
          python3 tests/kdb/test_offline_review_case_detail.py
          python3 tests/kdb/test_offline_review_workbench.py
          python3 tests/kdb/test_offline_review_snapshot_delta.py
          python3 tests/kdb/test_offline_review_demo_pack.py
          python3 tests/kdb/test_offline_review_viewmodel.py
          python3 tests/kdb/test_offline_source_bytes_proof.py
          python3 tests/kdb/test_offline_evidence_bound_review.py
          python3 tests/kdb/test_offline_current_case_evidence_demo.py
          python3 tests/kdb/test_offline_demo_acceptance_kit.py
          python3 tests/kdb/test_piac_fail_closed.py
          python3 tests/kdb/kdb_m01_06_security_static.py
          python3 tests/kdb/hosted_recovery_preflight_diff.py
          python3 tests/kdb/test_hosted_recovery_preflight.py
          python3 scripts/validate_sql_static.py
          python3 tests/kdb/test_p4_digest_static.py
          python3 tests/kdb/test_p4_oracle_classifier.py
          python3 tests/kdb/prove_p4_static_fail_propagation.py
          python3 tests/kdb/test_p5_static.py
          python3 tests/kdb/test_p5_trust_denial.py
          python3 tests/kdb/test_digest_v2_unproven.py
          python3 tests/kdb/test_signed_ingress.py
      - name: P2 ACL catalog and adversarial characterization
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: |
          python3 tests/kdb/pg17_acl_catalog.py
          python3 tests/kdb/pg17_adversarial_negatives.py
      - name: P3 fail-closed security oracles
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p3_security_oracles.py
      - name: P4 digest fixtures and fail-closed security oracles
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: |
          python3 tests/kdb/pg17_p4_digest_fixtures.py
          python3 tests/kdb/pg17_p4_security_oracles.py
          python3 tests/kdb/pg17_p4_tenant_digest_mutation.py
      - name: P5 SQL-v2 parity and signed ingress oracles
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: |
          python3 tests/kdb/pg17_p5_sql_v2_parity.py
          python3 tests/kdb/pg17_p5_signed_ingress_oracles.py
      - name: P11 disposable PG17 source-to-review readback
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p11_source_review_readback.py
      - name: P12 disposable PG17 commit reconnect replay revocation
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p12_commit_reconnect_replay.py
      - name: P13 offline review-handoff preview
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p13_review_handoff_preview.py
      - name: P14 offline review-inbox read model
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p14_review_inbox.py
      - name: P15 offline review case detail
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p15_review_case_detail.py
      - name: P16 static offline review workbench
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p16_review_workbench.py
      - name: P17 offline snapshot-delta workbench
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p17_review_snapshot_delta.py
      - name: P18 portable offline review demo pack
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p18_review_demo_pack.py
      - name: P19 versioned offline review viewmodel
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p19_review_viewmodel.py
      - name: P20 offline source-bytes evidence proof
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p20_source_bytes_proof.py
      - name: P21 offline evidence-bound review
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p21_evidence_bound_review.py
      - name: P22 portable current-case evidence demo
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p22_current_case_evidence_demo.py
      - name: P23 reproducible offline demo acceptance kit
        run: |
          mkdir -p tests/kdb/demo-artifacts
          cp tests/kdb/fixtures/p20_inbox_byte_spans.json tests/kdb/demo-artifacts/p23-current.json
          python3 services/kdb/offline_demo_acceptance_kit.py build tests/kdb/fixtures/p20_inbox_byte_spans.json tests/kdb/demo-artifacts/p23-current.json --work-item-id aaaaaaaa-bbbb-4ccc-8ddd-777777777777 --source-file tests/kdb/fixtures/p20_source_a.bin --output tests/kdb/demo-artifacts/kdb-p23-offline-demo.zip --commit "${{ github.sha }}"
          python3 services/kdb/offline_demo_acceptance_kit.py verify tests/kdb/demo-artifacts/kdb-p23-offline-demo.zip
          python3 services/kdb/offline_demo_acceptance_kit.py smoke tests/kdb/demo-artifacts/kdb-p23-offline-demo.zip
      - name: Publish P23 offline demo ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kdb-p23-offline-demo-${{ github.sha }}
          path: tests/kdb/demo-artifacts/kdb-p23-offline-demo.zip
          if-no-files-found: error
          retention-days: 30
