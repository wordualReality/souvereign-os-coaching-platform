name: kdb-m01-pg17-disposable

on:
  pull_request:
    paths:
      - "database/migrations/kdb/**"
      - "tests/kdb/**"
      - "n8n/kdb-dev/**"
      - "contracts/kdb/**"
      - "services/kdb/**"
      - "scripts/validate_sql_static.py"
      - ".github/workflows/kdb-m01-pg17.yml"
  push:
    branches: ["kdb/**"]
    paths:
      - "database/migrations/kdb/**"
      - "tests/kdb/**"
      - "n8n/kdb-dev/**"
      - "contracts/kdb/**"
      - "services/kdb/**"
      - "scripts/validate_sql_static.py"
      - ".github/workflows/kdb-m01-pg17.yml"

permissions:
  contents: read

jobs:
  pg17-apply-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kdb_local_super
          POSTGRES_DB: kdb_m01_disposable
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kdb_local_super -d kdb_m01_disposable"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply 001-003 plus P3 005 and P4 digest integrity, oracles, rollback/reapply
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_disposable_apply.py
      - name: O1-O3 command path fail-closed until trust attested
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_disposable_command_path.py
      - name: Offline classifier and replay/DLQ policy
        run: |
          node n8n/kdb-dev/test_workflow_regression.cjs n8n/kdb-dev/tenant-guard-candidate /tmp/kdb-tenant-guard.json
          node n8n/kdb-dev/test_replay_dlq.cjs n8n/kdb-dev/tenant-guard-candidate /tmp/kdb-replay-dlq.json
          python3 tests/kdb/test_replay_dlq_policy.py
          python3 tests/kdb/test_piac_fail_closed.py
          python3 tests/kdb/kdb_m01_06_security_static.py
          python3 tests/kdb/hosted_recovery_preflight_diff.py
          python3 tests/kdb/test_hosted_recovery_preflight.py
          python3 scripts/validate_sql_static.py
          python3 tests/kdb/test_p4_digest_static.py
          python3 tests/kdb/test_p4_oracle_classifier.py
          python3 tests/kdb/prove_p4_static_fail_propagation.py
          python3 tests/kdb/test_p5_static.py
          python3 tests/kdb/test_signed_ingress.py
      - name: P2 ACL catalog and adversarial characterization
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: |
          python3 tests/kdb/pg17_acl_catalog.py
          python3 tests/kdb/pg17_adversarial_negatives.py
      - name: P3 fail-closed security oracles
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: python3 tests/kdb/pg17_p3_security_oracles.py
      - name: P4 digest fixtures and fail-closed security oracles
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: |
          python3 tests/kdb/pg17_p4_digest_fixtures.py
          python3 tests/kdb/pg17_p4_security_oracles.py
          python3 tests/kdb/pg17_p4_tenant_digest_mutation.py
      - name: P5 SQL-v2 parity and signed ingress oracles
        env:
          KDB_PG17_MODE: libpq
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: kdb_local_super
          PGDATABASE: kdb_m01_disposable
        run: |
          python3 tests/kdb/pg17_p5_sql_v2_parity.py
          python3 tests/kdb/pg17_p5_signed_ingress_oracles.py
