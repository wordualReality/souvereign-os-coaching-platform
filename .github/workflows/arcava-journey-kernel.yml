name: arcava-journey-kernel

# Executes the isolated fixture described in
# docs/arcava/ARC36P25-JOURNEY-KERNEL-DEVELOPMENT.md.
# The kernel job is not Spring Boot, PIAC, T150 or T050 acceptance.
# The path job proves the local journal and loopback HTTP service only.
on:
  pull_request:
  push:
    branches:
      - feat/arc36p25-journey-kernel-candidate-20261023
      - feat/arc36p25-journey-service-integration

permissions:
  contents: read

concurrency:
  group: arcava-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey-kernel:
    name: JourneyKernel fixture / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up isolated Java toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and execute synthetic journey checks
        shell: bash
        run: |
          set -euo pipefail
          classes_dir="$(mktemp -d "${RUNNER_TEMP}/arcava-kernel.XXXXXX")"
          javac -version
          javac -Xlint:all -Werror -d "$classes_dir" \
            services/api/src/main/java/com/projectb/api/domain/JourneyKernel.java \
            services/api/src/test/java/com/projectb/api/domain/JourneyKernelTest.java
          java -cp "$classes_dir" com.projectb.api.domain.JourneyKernelTest
  journey-http-path:
    name: Persisted loopback journey path / JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up isolated Java toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile and execute persisted HTTP path
        shell: bash
        run: |
          set -euo pipefail
          classes_dir="$(mktemp -d "${RUNNER_TEMP}/arcava-http.XXXXXX")"
          javac -Xlint:all -Werror -d "$classes_dir" \
            services/api/src/main/java/com/projectb/api/domain/JourneyKernel.java \
            services/api/src/main/java/com/projectb/api/domain/JourneyJournal.java \
            services/api/src/main/java/com/projectb/api/json/JsonMini.java \
            services/api/src/main/java/com/projectb/api/http/JourneyHttpServer.java \
            services/api/src/main/java/com/projectb/api/http/JourneyProducer.java \
            services/api/src/main/java/com/projectb/api/http/TrustedKdbVerifier.java \
            services/api/src/main/java/com/projectb/api/http/TrustedPiacVerifier.java \
            services/api/src/test/java/com/projectb/api/http/JourneyPathTest.java \
            services/api/src/test/java/com/projectb/api/http/JourneyProducerTest.java \
            services/api/src/test/java/com/projectb/api/http/JournalAtomicityTest.java \
            services/api/src/test/java/com/projectb/api/http/AuthorityBoundaryTest.java
          python3 - << 'PY'
          import sys
          print("PYTHON_RUNTIME", sys.version.split()[0], sys.platform)
          print("NONREPRODUCIBLE_RUNNER image=ubuntu-latest interpreter=host-python3 patch_not_pinned")
          PY
          python3 -m venv "${RUNNER_TEMP}/wire-venv"
          "${RUNNER_TEMP}/wire-venv/bin/pip" install \
            --disable-pip-version-check \
            --no-cache-dir \
            --require-hashes \
            --only-binary=:all: \
            -r docs/arcava/admission/wire-python-deps.lock
          "${RUNNER_TEMP}/wire-venv/bin/python" - << 'PY'
          import importlib.metadata as md
          import sys
          names = (
              "jsonschema",
              "attrs",
              "jsonschema-specifications",
              "referencing",
              "rpds-py",
              "typing-extensions",
          )
          print("PYTHON_RUNTIME", sys.version.split()[0], sys.platform)
          for name in names:
              print(f"WIRE_DEP {name}=={md.version(name)}")
          print("WIRE_LOCK_INSTALL exit=0")
          PY
          python3 scripts/check_arcava_wire_python_lock.py --self-check
          java -cp "$classes_dir" com.projectb.api.http.JourneyPathTest
          producer_log="${RUNNER_TEMP}/producer.out"
          java -cp "$classes_dir" com.projectb.api.http.JourneyProducerTest | tee "$producer_log"
          bodies="$(awk '/^BODIES / { print $2 }' "$producer_log")"
          test -n "$bodies"
          test -f "$bodies"
          requests="$(awk '/^REQUESTS / { print $2 }' "$producer_log")"
          test -n "$requests"
          test -f "$requests"
          "${RUNNER_TEMP}/wire-venv/bin/python" scripts/validate_arcava_producer_wire_fixtures.py --bodies "$bodies"
          "${RUNNER_TEMP}/wire-venv/bin/python" scripts/validate_arcava_producer_wire_fixtures.py --bodies "$bodies" --self-check
          "${RUNNER_TEMP}/wire-venv/bin/python" scripts/validate_arcava_producer_request_wire.py --requests "$requests"
          "${RUNNER_TEMP}/wire-venv/bin/python" scripts/validate_arcava_producer_request_wire.py --requests "$requests" --self-check
          java -cp "$classes_dir" com.projectb.api.http.JournalAtomicityTest
          java -cp "$classes_dir" com.projectb.api.http.AuthorityBoundaryTest

  journey-active-dev-http:
    name: Active dev HTTP lifecycle / JDK 25 / Maven 3.9.16
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up isolated Java toolchain
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Package the executable JAR and run the java -jar lifecycle
        shell: bash
        run: |
          set -euo pipefail
          maven_dir="${RUNNER_TEMP}/apache-maven-3.9.16"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/maven.tgz" \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          tar -xzf "${RUNNER_TEMP}/maven.tgz" -C "${RUNNER_TEMP}"
          PATH="${maven_dir}/bin:${PATH}" python3 scripts/toolchain_receipt.py --runtime java,maven
          "${maven_dir}/bin/mvn" -B -f services/api/pom.xml package
          chmod +x services/api/scripts/jar-lifecycle-smoke.sh services/api/scripts/operator-active-dev.sh
          services/api/scripts/jar-lifecycle-smoke.sh services/api/target/projectb-api-0.1.0-SNAPSHOT.jar
          services/api/scripts/operator-active-dev.sh services/api/target/projectb-api-0.1.0-SNAPSHOT.jar
          echo "This job does not admit live PIAC, live KDB, T150, T020, T050 or T160."
