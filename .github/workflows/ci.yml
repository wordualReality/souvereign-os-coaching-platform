name: project-b-contract-validation

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation deps
        run: pip install pyyaml jsonschema
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Validate OpenAPI contracts
        run: python scripts/validate_openapi.py
      - name: Validate JSON schemas and AsyncAPI parse
        run: python scripts/validate_json_schemas.py
      - name: Validate SQL migrations static fallback
        run: python scripts/validate_sql_static.py
      - name: Validate RLS static fallback
        run: python scripts/validate_rls_static.py
      - name: Validate MVP Slice 01 skeleton
        run: python scripts/validate_mvp_slice_01.py
      - name: Check the toolchain receipt and A09 case discovery
        run: |
          python scripts/toolchain_receipt.py
          python scripts/toolchain_receipt.py --self-check
          python scripts/a09_case_discovery.py
          python scripts/a09_case_discovery.py --self-check

  web-renderer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.12.2'
          cache: npm
      - name: Install the pinned renderer and run the loopback smoke
        run: |
          set -euo pipefail
          python3 scripts/toolchain_receipt.py --runtime node
          npm ci
          chmod +x apps/web/scripts/renderer-smoke.sh apps/web/scripts/operator-web.sh
          apps/web/scripts/renderer-smoke.sh
          apps/web/scripts/operator-web.sh
          echo "This job does not admit live PIAC, live KDB, T150, T020, T050 or T160."
